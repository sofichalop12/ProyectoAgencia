<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia de Turismo - Panel de Gestión</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0284c7;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { color: var(--primary); margin: 0; }

        .btn-refresh {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border-top: 4px solid var(--accent);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .PENDIENTE { background: #fef08a; color: #854d0e; }
        .EN_CURSO { background: #bae6fd; color: #075985; }
        .FINALIZADO { background: #bbf7d0; color: #166534; }

        .progress-bar {
            background: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .advance-form {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .advance-form input {
            width: 80px;
            padding: 0.4rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        .advance-form button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Agencia de Turismo - Panel de Viajes</h1>
        <button class="btn-refresh" onclick="cargarViajes()">🔄 Actualizar</button>
    </header>

    <main id="viajes-container" class="container">
        <!-- Las tarjetas de viajes se cargarán dinámicamente -->
    </main>

    <script src="app.js"></script>
</body>
</html>
